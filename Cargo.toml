[package]

name = "rust-proxy"
version = "0.1.0"
edition = "2021"

[dependencies]

# Framework web assíncrono (servidor HTTP)
# multipart: extractor pra receber upload de arquivos (endpoint de criação de item)
axum = { version = "0.7", features = ["multipart"] }

# Runtime assíncrono que o axum precisa pra rodar
tokio = { version = "1", features = ["full"] }

# Cliente HTTP pra buscar dados na API externa
# cookie_store: mantém a sessão (cookie de login) entre as chamadas, igual requests.Session() do Python
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies", "multipart"] }

# Serialização/deserialização JSON
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Decodifica o payload base64 dentro do cookie __session
base64 = "0.22"

# Decodifica respostas do ConstruCode que vêm em Windows-1252 (páginas ASP.NET
# legadas) mesmo com reqwest sem a feature "charset".
encoding_rs = "0.8"

# Compara a data de expiração do token gravado em disco
chrono = "0.4"

# Logs simples
tracing = "0.1"
tracing-subscriber = "0.3"

# Documentação OpenAPI/Swagger
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "8", features = ["axum"] }

# CORS, pra liberar chamadas do Office Scripts (Excel)
tower-http = { version = "0.6", features = ["cors"] }
